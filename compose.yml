# Mortise hub — VDS'te 7/24 açık düğüm.
#
# Bu dosya yalnızca HUB'ı tanımlar. Masaüstü düğümleri kendi yerel Mortise
# kurulumlarını çalıştırır (scripts/node-setup.sh); onlar bu compose'a
# dahil değil.
#
# Sunucudaki mevcut ~30 container'a dokunmaz: kendi bridge ağı, Caddy'ye
# hiç temas yok, 80/443 kullanılmıyor.

name: mortise

services:
  hub:
    # FORK NOKTASI — altta çalışan senkron motoru. Faz 2'de kendi
    # imajımıza geçerken değişecek tek satır burası; motorun adı ve
    # sürümü .env'de MORTISE_VERSION ile tutuluyor.
    # Gerekçe ve süreç: docs/fork-notes.md
    image: syncthing/syncthing:${MORTISE_VERSION:?.env icinde MORTISE_VERSION tanimli olmali}
    container_name: mortise-hub
    hostname: ${MORTISE_HOSTNAME:-mortise-hub}
    restart: unless-stopped

    # `user:` DEĞİL, PUID/PGID: imajın entrypoint'i root olarak başlayıp
    # veri dizinini chown ettikten sonra su-exec ile bu kullanıcıya düşer.
    # `user:` verirsek o chown adımı izin hatası verir.
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}

    # Sağdaki yollar motorun kendi sözleşmesi (imajda STHOMEDIR/HOME) —
    # fork'a kadar sabit. Soldaki, Mortise'ın sunucudaki yerleşimi.
    volumes:
      # Hub'ın kimliği: device ID ve özel anahtar burada. Yedeklenmesi
      # gereken asıl dizin bu; kaybolursa hub yeni bir kimlik alır ve
      # bütün eşlemeler kopar.
      - ${MORTISE_HOME:?.env icinde MORTISE_HOME tanimli olmali}/config:/var/syncthing/config
      # Senkronlanan vault'lar.
      - ${MORTISE_HOME}/data:/var/syncthing/data

    ports:
      # GUI: yalnızca localhost. Erişim SSH tüneliyle — scripts/tunnel.sh
      - "127.0.0.1:8384:8384"
      # Cihaz senkronu. Açık internete bakar; cihaz ID'li TLS ile korunur,
      # şifresiz bir yüzey değil.
      - "22000:22000/tcp"
      - "22000:22000/udp"
      # 21027/udp bilerek YOK: LAN keşif yayını. VDS'te karşılığı olmayan,
      # yalnızca saldırı yüzeyi ekleyen bir port.

    # Disk %81 dolu ve 5 Postgres ile paylaşılıyor. Sınırsız json-file
    # logu buradaki en sessiz disk sızıntısı olurdu.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # HEALTHCHECK tanımlanmadı: imaj kendi sağlık ucunu zaten dakikada
    # bir yokluyor.
